name: Release

# Publishes a GitHub release when the manifest version has no tag yet.
# HACS only offers versions that exist as releases.
on:
  push:
    branches: [main]
    paths:
      - custom_components/family_location/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/family_location/manifest.json'))['version'])")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Family Location ${TAG#v}" --generate-notes
          fi
